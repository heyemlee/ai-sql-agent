<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">AI SQL Agent · Console</title>
<style>
/* ─── monochrome design tokens ──────────────────────────────────── */
:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #ffffff;
  --surface:      #f5f5f5;             /* pearl — card surface, elevated panel */
  --surface-warm: #fafafa;             /* mist — section break, footer */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:   #0d0d0d;                     /* ink black — primary text, brand mark */
  --fg-2: #1a1a1a;                     /* soft black — alternative headings */
  --muted: #6e6e6e;                    /* slate — secondary text, captions */
  --meta:  #9b9b9b;                    /* ash — tertiary, placeholder */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      #e5e5e5;             /* hairline — standard separator */
  --border-soft: #ededed;             /* card outline on white surface */

  /* ─── Accent ───────────────────────────────────────────────────── */
  --accent:        #171717;           /* black — links, highlight, CTA */
  --accent-on:     #ffffff;
  --accent-hover:  #333333;           /* charcoal — hover/pressed */
  --accent-active: color-mix(in oklab, var(--accent), black 14%);

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: #171717;                 /* neutral — success path */
  --warn:    #737373;                 /* gray — advisory, paired with labels and icons */
  --danger:  #404040;                 /* charcoal — errors, paired with explicit labels */

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Signifier", "Source Serif Pro", Georgia, ui-serif, serif;
  --font-body:    "Söhne", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:    "Söhne Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   13px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   20px;
  --text-2xl:  28px;
  --text-3xl:  40px;
  --text-4xl:  56px;

  --leading-body:     1.65;
  --leading-tight:    1.08;
  --tracking-display: -0.02em;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;
  --space-16: 64px;

  --section-y-desktop: 96px;
  --section-y-tablet:  64px;
  --section-y-phone:   48px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  --radius-sm:   12px;
  --radius-md:   16px;
  --radius-lg:   16px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  --elev-flat:   none;
  --elev-ring:   0 0 0 1px var(--border);
  --elev-raised: 0 4px 16px rgba(13, 13, 13, 0.06);

  /* ─── Focus ────────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 3px rgba(0, 0, 0, 0.1);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   220ms;
  --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 48px;
  --container-gutter-tablet:  24px;
  --container-gutter-phone:   24px;

  /* derived — console shell */
  --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
  --warn-soft:   color-mix(in oklch, var(--warn) 14%, transparent);
  --danger-soft: color-mix(in oklch, var(--danger) 12%, transparent);
  --fg-soft:     color-mix(in oklch, var(--fg) 4%, transparent);
  --topbar-h:    60px;
  --rail-left:   304px;
  --rail-right:  344px;
}

/* ─── reset & base ─────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
p { margin: 0; text-wrap: pretty; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  box-shadow: var(--focus-ring);
}
::selection { background: var(--accent-soft); }

/* ─── type helpers ─────────────────────────────────────────────────── */
.h2 { font-size: var(--text-2xl); font-weight: 600; line-height: 1.2; letter-spacing: -0.005em; }
.h3 { font-size: var(--text-xl); font-weight: 600; line-height: 1.3; }
.eyebrow { font-family: var(--font-body); font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.rail-title { font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.caption { font-size: var(--text-sm); font-weight: 500; line-height: 1.4; color: var(--muted); }
.body-sm { font-size: 14px; line-height: 1.55; }
.muted { color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }

/* ─── shell ────────────────────────────────────────────────────────── */
.note {
  margin-top: var(--space-4);
  padding: var(--space-4);
  background: var(--surface-warm);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm);
}
.note-tag {
  display: block; margin-bottom: var(--space-2);
  font-family: var(--font-mono); font-size: var(--text-xs);
  letter-spacing: 0.06em; color: var(--muted);
}
.note-text { font-size: 14px; line-height: 1.7; color: var(--fg-2); }
.note-src {
  margin-top: var(--space-3); font-family: var(--font-mono);
  font-size: var(--text-xs); line-height: 1.5; color: var(--muted);
  overflow-wrap: anywhere; word-break: normal;
}
.note-sm { margin-top: var(--space-2); padding: var(--space-3); }
.note-sm .note-text { font-size: 13px; line-height: 1.6; }
.note-sm .note-tag { margin-bottom: 6px; }
.skip-link {
  position: absolute; left: var(--space-6); top: -100px; z-index: 30;
  display: inline-flex; align-items: center; min-height: 44px; padding: 10px 18px;
  background: var(--fg); color: var(--bg);
  border-radius: var(--radius-sm); font-size: 15px; font-weight: 500;
  transition: top var(--motion-fast) var(--ease-standard);
}
.skip-link:focus-visible { top: var(--space-2); }
.topbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-4);
  padding: 0 var(--space-6);
  background: color-mix(in oklch, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: var(--space-3); min-width: 0; }
.brand .mark { font-family: var(--font-display); font-size: var(--text-xl); letter-spacing: -0.01em; color: var(--fg); }
.brand .env { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); }
.topbar-actions { display: flex; align-items: center; gap: var(--space-2); }

.console {
  display: grid;
  grid-template-columns: var(--rail-left) minmax(0, 1fr) var(--rail-right);
  height: calc(100vh - var(--topbar-h));
}
.rail { overflow-y: auto; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-8); }
.rail-l { border-right: 1px solid var(--border); background: var(--surface-warm); }
.rail-r { border-left: 1px solid var(--border); background: var(--surface-warm); }
.workbench { overflow-y: auto; display: flex; flex-direction: column; }
.workbench-inner { width: 100%; max-width: 760px; margin-inline: auto; padding: var(--space-8) var(--space-8) var(--space-16); display: flex; flex-direction: column; gap: var(--space-6); }
.stack-3 > * + * { margin-top: var(--space-3); }
.stack-4 > * + * { margin-top: var(--space-4); }
.stack-6 > * + * { margin-top: var(--space-6); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }

/* ─── buttons ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 44px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 15px; font-weight: 500; letter-spacing: -0.005em;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn-primary:hover { background: var(--fg-2); color: var(--bg); border-color: var(--fg-2); }
.btn-primary:disabled { background: var(--surface); color: var(--meta); border-color: var(--border); cursor: not-allowed; }
.btn-secondary { background: var(--bg); color: var(--fg); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-warm); color: var(--fg); border-color: color-mix(in oklch, var(--border), var(--fg) 18%); }
.btn-ghost { background: transparent; color: var(--muted); border-color: transparent; padding-inline: var(--space-3); }
.btn-ghost:hover { background: var(--surface); color: var(--fg); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: var(--text-sm); border-radius: var(--space-2); }
.icon-btn {
  display: inline-grid; place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent; color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.icon-btn:hover { background: var(--surface); color: var(--fg); }
.icon-btn svg { width: 18px; height: 18px; }

/* ─── chips / pills ────────────────────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--surface); color: var(--muted);
  border-radius: var(--radius-pill);
  font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.01em;
  white-space: nowrap;
}
.chip-db { font-family: var(--font-mono); }
.chip-hit { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--fg) 20%, transparent); }
.chip-warn { background: var(--warn-soft); color: color-mix(in oklch, var(--warn), black 34%); }
.chip-danger { background: var(--danger-soft); color: color-mix(in oklch, var(--danger), black 22%); }
.dot { width: 7px; height: 7px; border-radius: var(--radius-pill); background: currentColor; flex: none; }
.status-chip { border: 1px solid var(--border); background: var(--bg); }
.status-chip.is-live { border-color: color-mix(in oklch, var(--accent) 34%, var(--border)); background: var(--accent-soft); color: var(--accent-hover); }
.status-chip.is-demo { color: var(--muted); }

.ask-chip {
  display: inline-flex; align-items: center;
  min-height: 40px; padding: 6px 14px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg); color: var(--muted);
  font-size: var(--text-sm); text-align: left;
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.ask-chip:hover { background: var(--surface-warm); color: var(--fg); border-color: color-mix(in oklch, var(--border), var(--fg) 18%); }

/* ─── cards ────────────────────────────────────────────────────────── */
.card {
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: var(--space-6);
}
.card-tight { padding: var(--space-4); }
.card-flag { border-color: color-mix(in oklch, var(--warn) 40%, var(--border)); background: color-mix(in oklch, var(--warn) 5%, var(--bg)); }
.flag-in { animation: flagIn 520ms var(--ease-standard) both; }
@keyframes flagIn {
  from { border-color: var(--warn); background: color-mix(in oklch, var(--warn) 16%, var(--bg)); }
  to   { border-color: color-mix(in oklch, var(--warn) 40%, var(--border)); background: color-mix(in oklch, var(--warn) 5%, var(--bg)); }
}

/* ─── composer ─────────────────────────────────────────────────────── */
.composer { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4) var(--space-4) var(--space-3); transition: border-color var(--motion-fast) var(--ease-standard); }
.composer:focus-within { border-color: var(--accent); box-shadow: var(--focus-ring); }
.composer textarea {
  width: 100%; border: 0; resize: none; outline: none;
  background: transparent; color: var(--fg);
  font: inherit; font-size: var(--text-lg); line-height: 1.55;
  min-height: 76px; padding: 0;
}
.composer textarea::placeholder { color: var(--muted); }
.composer-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border-soft); }
.composer-foot-left { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.kbd { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; background: var(--bg); }
.ask-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }

/* toggle */
.toggle { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 36px; padding: 0 var(--space-2); border-radius: var(--radius-pill); color: var(--muted); font-size: var(--text-sm); background: transparent; border: 0; }
.toggle:hover { color: var(--fg); }
.toggle .track { width: 34px; height: 20px; border-radius: var(--radius-pill); background: color-mix(in oklch, var(--fg) 18%, transparent); position: relative; transition: background var(--motion-fast) var(--ease-standard); flex: none; }
.toggle .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--radius-pill); background: var(--bg); transition: transform var(--motion-fast) var(--ease-standard); }
.toggle[aria-pressed="true"] { color: var(--fg); }
.toggle[aria-pressed="true"] .track { background: var(--fg); }
.toggle[aria-pressed="true"] .track::after { transform: translateX(14px); }

/* ─── rail lists ───────────────────────────────────────────────────── */
.rail-list { display: flex; flex-direction: column; gap: var(--space-1); }
.src {
  display: block; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--space-2);
  border: 1px solid transparent; background: transparent;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.src:hover { background: var(--bg); border-color: var(--border-soft); }
.src.is-hit { background: var(--bg); border-color: color-mix(in oklch, var(--fg) 30%, var(--border)); }
.src-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.src-name { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--fg); }
.src-tables { font-size: var(--text-xs); color: var(--muted); margin-top: 3px; line-height: 1.45; word-break: break-word; }

.hist {
  display: block; width: 100%; text-align: left;
  padding: 12px 10px; border-radius: var(--space-2);
  border: 1px solid transparent; background: transparent;
  transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.hist:hover { background: var(--bg); border-color: var(--border-soft); }
.hist[aria-current="true"] { background: var(--bg); border-color: color-mix(in oklch, var(--fg) 22%, var(--border)); }
.hist-q { font-size: 13px; line-height: 1.5; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hist-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.hist-time { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); }

/* ─── pipeline (right rail) ────────────────────────────────────────── */
.pipe { display: flex; flex-direction: column; }
.pipe-step { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--space-3); padding-bottom: var(--space-4); position: relative; }
.pipe-step:last-child { padding-bottom: 0; }
.pipe-step::before { content: ''; position: absolute; left: 9px; top: 18px; bottom: 0; width: 1px; background: var(--border); }
.pipe-step:last-child::before { display: none; }
.pipe-node { width: 19px; height: 19px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg); display: grid; place-items: center; position: relative; z-index: 1; }
.pipe-node svg { width: 11px; height: 11px; color: var(--muted); }
.pipe-step.is-done .pipe-node { border-color: color-mix(in oklch, var(--fg) 30%, var(--border)); }
.pipe-step.is-done .pipe-node svg { color: var(--fg); }
.pipe-step.is-flag .pipe-node { border-color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, var(--bg)); }
.pipe-step.is-flag .pipe-node svg { color: color-mix(in oklch, var(--warn), black 34%); }
.pipe-step.is-skip { opacity: 0.55; }
.pipe-step.is-active .pipe-node { border-color: var(--fg); background: var(--fg); }
.pipe-step.is-active .pipe-label { font-weight: 600; }
.pipe-node .pulse { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--bg); animation: pulse 900ms var(--ease-standard) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.pipe-label { display: block; font-size: 14px; font-weight: 500; line-height: 1.35; }
.pipe-detail { display: block; font-size: var(--text-xs); color: var(--muted); line-height: 1.5; margin-top: 3px; word-break: break-word; }

.kv { display: grid; grid-template-columns: minmax(88px, auto) minmax(0, 1fr); gap: 6px var(--space-3); font-size: var(--text-sm); }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); color: var(--fg); word-break: break-all; }

/* ─── steps / sql ──────────────────────────────────────────────────── */
.step-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.step-title { display: flex; align-items: center; gap: var(--space-2); font-size: 14px; font-weight: 500; }
.step-idx { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.sql {
  margin: var(--space-3) 0 0;
  padding: var(--space-4);
  background: var(--surface);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
  color: var(--fg-2);
  white-space: pre-wrap; word-break: break-word;
  overflow-x: auto;
}
.sql .kw { color: var(--muted); }
.tabs { display: flex; gap: var(--space-1); margin-top: var(--space-4); border-bottom: 1px solid var(--border); }
.tab {
  min-height: 36px; padding: 0 12px 8px; background: transparent; border: 0;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  font-size: var(--text-sm); font-weight: 500; color: var(--muted);
  transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }

/* ─── table ────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; margin-top: var(--space-4); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); }
.table-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: var(--focus-ring); }
.ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ds-table th, .ds-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
.ds-table thead th { background: var(--surface-warm); color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.03em; }
.ds-table tbody tr:last-child td { border-bottom: 0; }
.ds-table tbody tr:hover td { background: var(--fg-soft); }
.ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

/* ─── flags ────────────────────────────────────────────────────────── */
.fb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.fb-btn { display: inline-flex; align-items: center; gap: 6px; }
.fb-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.fb-comment { width: 100%; margin-top: var(--space-4); padding: 10px 12px; font: inherit; font-size: var(--text-sm);
  color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: var(--space-2); resize: vertical; min-height: 44px; }
.fb-comment:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
.fb-done { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.fb-done svg { width: 16px; height: 16px; color: var(--fg); flex: none; }
.flag { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: var(--space-3); align-items: start; }
.flag + .flag { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid color-mix(in oklch, var(--warn) 26%, transparent); }

<a class="skip-link" href="#q" id="skipToAsk" data-od-id="skip-to-composer" data-i18n="skip">Skip to question box</a>

<header class="topbar" data-od-id="topbar">
  <div class="brand">
    <button class="icon-btn" id="btnSidebar" aria-controls="sidebar" aria-expanded="true" data-i18n-aria="chat.sidebar"><svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg></button>
    <span class="brand-symbol"><svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg></span><span class="mark">AI SQL Agent</span>
    <span class="env" id="envLabel"></span>
  </div>
  <div class="topbar-actions">
    <span class="chip status-chip is-demo" id="connChip"><span class="dot"></span><span id="connText" data-i18n="conn.checking"></span></span>
    <button class="btn btn-ghost btn-sm" id="btnLang">中文</button>
    <button class="icon-btn" id="btnExplain" aria-pressed="false" data-i18n-aria="explain"><svg class="icon" aria-hidden="true"><use href="#i-code"/></svg></button>
    <button class="icon-btn" id="btnSettings" data-od-id="open-settings" data-i18n-aria="settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    <button class="icon-btn" id="btnHelp" data-i18n-aria="shortcuts"><span aria-hidden="true">?</span></button>
  </div>
</header>
<button id="drawerBackdrop" hidden data-i18n-aria="ui.closeSidebar"></button>
<div class="console" id="console">
  <aside class="rail rail-l" id="sidebar" data-od-id="rail-sources">
    <button class="btn btn-secondary" id="btnNew" data-od-id="new-query"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-i18n="newQuery"></span></button>
    <section class="history-section" data-od-id="rail-history">
      <div class="row-between rail-section-head"><h2 class="rail-title" data-i18n="history"></h2><button class="icon-btn" style="width:24px;height:24px" id="btnRefreshHistory" data-i18n-aria="refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button></div>
      <label class="history-search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="historySearch" data-i18n-ph="ui.search" data-i18n-aria="ui.search" autocomplete="off"></label><div class="rail-list" id="historyList"></div>
      <p class="caption audit-caption" data-i18n="audit.note"></p><div id="auditNote"></div>
    </section>
    <details class="source-section" open>
      <summary><h2 class="rail-title" data-i18n="ui.sources"></h2><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></summary>
      <span class="sr-only" id="hitCount"></span><div class="rail-list" id="sourceList"></div><div id="sourcesPool"></div><div id="sourcesNote"></div>
    </details>
  </aside>
  <main class="workbench is-empty" id="workbench" data-od-id="workbench">
    <div class="chat-header"><span class="chat-title"><span class="dot"></span><span class="chat-title-text" id="chatTitle" data-i18n="chat.workspace"></span></span><button class="btn btn-ghost btn-sm" id="btnTrace" aria-expanded="false" aria-controls="tracePanel"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span data-i18n="chat.details"></span></button></div>
    <div class="conn-banner" id="connectionBanner" hidden><span data-i18n="ui.offline"></span><button type="button" id="reconnect" data-i18n="ui.reconnect"></button></div>
    <div class="chat-scroll" id="chatScroll"><div class="workbench-inner"><section id="result" data-od-id="result" aria-label="Conversation" aria-live="polite" aria-relevant="additions text" aria-busy="false"></section></div></div>
    <div class="composer-dock" data-od-id="composer">
      <button class="btn" id="jumpLatest" hidden><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg><span data-i18n="chat.latest"></span></button>
      <div class="edit-note" id="editNote" hidden><span data-i18n="chat.editing"></span><button class="btn btn-ghost btn-sm" id="cancelEdit" data-i18n="cancel"></button></div>
      <form class="composer" id="composerForm">
        <label for="q" class="sr-only" data-i18n="ask"></label>
        <textarea id="q" rows="1" data-i18n-ph="ask.ph"></textarea>
        <div class="composer-foot">
          <div class="composer-foot-left"><button class="toggle" id="btnLongTerm" aria-pressed="false" type="button"><span class="track" aria-hidden="true"></span><span data-i18n="longTerm"></span></button><span class="session-label" id="sessionChip"></span></div>
          <div class="composer-tools"><span class="composer-mode"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg><span data-i18n="chat.readonly"></span></span><button class="send-btn" id="btnRun" type="submit" data-od-id="run-query" data-i18n-aria="run" disabled><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
        </div>
      </form>
      <p class="composer-hint" data-i18n="chat.hint"></p><div class="suggestions" id="suggestions"></div><div class="ask-chips" id="askChips"></div><div id="composerNote"></div>
    </div>
  </main>
  <aside class="rail rail-r" id="tracePanel" data-od-id="rail-trace" hidden>
    <div class="trace-heading"><h2 class="rail-title" data-i18n="chat.details"></h2><button class="icon-btn" id="closeTrace" data-i18n-aria="chat.close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <section><h3 class="rail-title" style="margin-bottom:16px" data-i18n="pipe.title"></h3><div class="pipe" id="pipeline"></div></section>
    <section data-od-id="rail-meta"><h3 class="rail-title" style="margin-bottom:16px" data-i18n="meta.title"></h3><dl class="kv" id="metaList"></dl></section>
  </aside>
</div>
<div id="toast" role="status" hidden></div>

<!-- ─── settings dialog ─────────────────────────────────────────── -->
<dialog id="dlgSettings" data-od-id="settings-dialog">
  <form method="dialog" class="sheet stack-6">
    <div>
      <h2 class="h3" data-i18n="settings">Connection settings</h2>
      <p class="caption" style="margin-top:6px" data-i18n="set.desc">Leave blank to use the same origin.</p>
    </div>
    <div class="stack-4">
      <div class="field">
        <label for="setBase" data-i18n="set.base">Service address</label>
        <input class="input" id="setBase" data-i18n-ph="set.base.ph" placeholder="http://127.0.0.1:8000" autocomplete="off">
      </div>
      <div class="field">
        <label for="setKey" data-i18n="set.key">API key (X-API-Key) · this tab only</label>
        <input class="input" id="setKey" type="password" data-i18n-ph="set.key.ph" placeholder="may be blank" autocomplete="off">
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="setUser" data-i18n="ui.user">User ID</label>
          <input class="input" id="setUser" placeholder="li" autocomplete="off">
        </div>
        <div class="field">
          <label for="setSession" data-i18n="ui.session">Session ID</label>
          <input class="input" id="setSession" placeholder="s1" autocomplete="off">
        </div>
      </div>
    </div>
    <div class="row-between">
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('dlgSettings').close('cancel')" data-i18n="cancel">Cancel</button>
      <button class="btn btn-primary" id="btnSaveSettings" value="save" type="submit" data-i18n="save">Save and reconnect</button>
    </div>
  </form>
</dialog>

<dialog id="dlgHelp">
  <div class="sheet stack-6">
    <h2 class="h3" data-i18n="shortcuts">Keyboard shortcuts</h2>
    <dl class="kv">
      <dt data-i18n="sc.submit">Run query</dt><dd>Enter · Shift + Enter ↵</dd>
      <dt data-i18n="sc.focus">Focus question box</dt><dd>/</dd>
      <dt data-i18n="sc.settings">Open connection settings</dt><dd>⌘ / Ctrl + K</dd>
      <dt data-i18n="sc.close">Close dialog</dt><dd>Esc</dd>
    </dl>
    <div style="display:flex;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="document.getElementById('dlgHelp').close()" data-i18n="gotIt">Got it</button>
    </div>
  </div>
</dialog>

/* 数据源与示例问题都来自后端的真实回报（/history 与 /query），不预置任何清单。 */
const state_sources = new Map();   // db -> Set(table)
const state_tables_pool = new Set(); // 多库查询里无法归属到具体库的表

function absorbSources(dbs, tables) {
  (dbs || []).forEach((d) => { if (!state_sources.has(d)) state_sources.set(d, new Set()); });
  (tables || []).forEach((t) => {
    const raw = String(t);
    if (raw.includes('.')) {
      const [db, tbl] = raw.split('.');
      if (!state_sources.has(db)) state_sources.set(db, new Set());
      state_sources.get(db).add(tbl);
    } else if ((dbs || []).length === 1) {
      // 审计里的 tables 不带库前缀；只有单库查询能确定归属
      state_sources.get(dbs[0]).add(raw);
    } else {
      state_tables_pool.add(raw);   // 多库查询：记下来，但不猜归属
    }
  });
}

const $ = (id) => document.getElementById(id);
const t = (k, vars) => {
  const dict = I18N[state.lang] || I18N.en;
  let out = (k in dict ? dict[k] : I18N.en[k]);
  if (out == null) return k;
  if (vars) for (const [n, v] of Object.entries(vars)) out = out.split('{' + n + '}').join(v);
  return out;
};
const fmtTime = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);            // 审计存的是带时区的 UTC ISO，必须转本地
  if (Number.isNaN(d.getTime())) return String(iso).replace('T', ' ').slice(5, 16);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const save = () => {
  localStorage.setItem(LS, JSON.stringify({
    base: state.base, userId: state.userId, sessionId: state.sessionId,
    longTerm: state.longTerm, explain: state.explain, lang: state.lang,
  }));
  // Key 只在当前标签页存活，不落 localStorage
  if (state.apiKey) sessionStorage.setItem(LS + '/key', state.apiKey);
  else sessionStorage.removeItem(LS + '/key');
};

let editingDraft = null;
let historyError = false;
const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const actionButton = (label, name, cls) => `<button class="icon-btn ${cls}" type="button" aria-label="${t(label)}" title="${t(label)}">${icon(name)}</button>`;
let toastTimer;
function toast(message) {
  $('toast').textContent = message; $('toast').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').hidden = true; }, 2200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast(t('copied')); }
  catch (_) { toast(t('chat.copyFailed')); }
}
function updateComposer() {
  const q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 192) + 'px';
  $('btnRun').disabled = !busy && !q.value.trim();
  $('btnRun').innerHTML = icon(busy ? 'stop' : 'arrow');
  $('btnRun').setAttribute('aria-label', t(busy ? 'chat.stop' : 'run'));
  $('btnRun').title = t(busy ? 'chat.stop' : 'run');
  ['btnNew', 'btnSettings', 'btnLang', 'btnExplain', 'btnLongTerm', 'btnRefreshHistory', 'reconnect'].forEach((id) => { $(id).disabled = busy; });
  document.querySelectorAll('.js-edit, .js-retry, .js-rerun, .hist, .js-fb, .js-fb-reset').forEach((el) => { el.disabled = busy; });
}
function setDraft(text) { $('q').value = text; updateComposer(); $('q').focus(); }
function closeMobileSidebar() {
  if (matchMedia('(max-width: 900px)').matches) { $('sidebar').classList.remove('is-open'); $('workbench').inert = false; $('drawerBackdrop').hidden = true; $('btnSidebar').setAttribute('aria-expanded', 'false'); }
}
function scrollLatest(force = false) {
  const viewport = $('chatScroll');
  if (force || viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight < 180) {
    viewport.scrollTo({ top: viewport.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
  }
  requestAnimationFrame(updateJump);
}
function updateJump() {
  const el = $('chatScroll'); $('jumpLatest').hidden = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
}
function resetConversation() {
  turns.length = 0; activeTurn = null; state.current = null; state.activeTrace = null;
  $('chatTitle').textContent = t('ui.workspace');
  $('result').innerHTML = ''; $('editNote').hidden = true; editingDraft = null;
}
function createTurn(question) {
  if (!turns.length) $('result').innerHTML = '';
  $('workbench').classList.remove('is-empty');
  const turn = { id: 'turn-' + crypto.randomUUID(), question, result: null, opts: {} };
  turns.push(turn); activeTurn = turn;
  $('chatTitle').textContent = question; $('chatTitle').title = question;
  const el = document.createElement('article'); el.className = 'turn fade-in'; el.id = turn.id;
  el.innerHTML = `<div class="user-message"><div class="user-bubble">${esc(question)}</div><div class="message-actions">${actionButton('chat.copyQuestion','copy','js-copy-question')}${actionButton('chat.edit','edit','js-edit')}</div></div><div class="assistant-label">${icon('spark')}<span>AI SQL Agent</span></div><div class="response"></div>`;
  $('result').append(el);
  el.querySelector('.js-copy-question').onclick = () => copyText(question);
  el.querySelector('.js-edit').onclick = () => {
    if (busy) return;
    if (editingDraft === null) editingDraft = $('q').value;
    $('editNote').hidden = false; setDraft(question);
  };
  closeMobileSidebar();
  return turn;
}
function responseRoot(turn = activeTurn) { return turn ? $(turn.id).querySelector('.response') : $('result'); }

/* ─── left rail ─────────────────────────────────────────────────── */
function renderSources() {
  const hits = new Set(state.current?.selected_databases || []);
  const dbs = [...state_sources.keys()].sort();
  $('envLabel').textContent = dbs.length ? t('env.dbs', { n: dbs.length }) : t('env.readonly');
  if (!dbs.length) {
    $('sourceList').innerHTML = `<p class="caption" style="line-height:1.6">${t('sources.empty')}</p>`;
    $('hitCount').textContent = '—';
  } else {
    $('sourceList').innerHTML = dbs.map((db) => {
      const tables = [...state_sources.get(db)].sort();
      return `
      <button class="src ${hits.has(db) ? 'is-hit' : ''}" data-db="${esc(db)}" data-od-id="source-${esc(db)}">
        <span class="src-head">
          <span class="src-name">${esc(db)}</span>
          ${hits.has(db) ? `<span class="chip chip-hit">${t('sources.hit')}</span>` : `<span class="caption num">${t('sources.tables', { n: tables.length })}</span>`}
        </span>
        <span class="src-tables">${tables.length ? tables.map(esc).join(' · ') : t('sources.noTables')}</span>
      </button>`;
    }).join('');
    $('hitCount').textContent = hits.size ? t('sources.hitCount', { n: hits.size, m: dbs.length }) : t('sources.count', { n: dbs.length });
    $('sourceList').querySelectorAll('.src').forEach((el) => {
      el.addEventListener('click', () => { setDraft(t('sources.prefill', { db: el.dataset.db })); closeMobileSidebar(); });
    });
  }
  const pooled = [...state_tables_pool].filter((t) =>
    ![...state_sources.values()].some((set) => set.has(t))).sort();
  $('sourcesPool').innerHTML = pooled.length
    ? `<p class="caption" style="margin-top:var(--space-3);line-height:1.6">${t('sources.pooled')}<br><span class="mono" style="font-size:var(--text-xs)">${pooled.map(esc).join(' · ')}</span></p>`
    : '';
  $('sourcesNote').innerHTML = note('sources', true);
}

/* Suggestions are editable starting points; recent questions come from real history. */
function renderExamples() {
  const suggestions = [['lookup', 'search'], ['trends', 'chart'], ['compare', 'compare']];
  $('suggestions').innerHTML = suggestions.map(([key, glyph]) => `<button class="suggestion" type="button" data-key="${key}">${icon(glyph)}<strong>${t('ui.' + key)}</strong><span>${t('ui.' + key + 'Hint')}</span></button>`).join('');
  $('suggestions').querySelectorAll('button').forEach((btn) => { btn.onclick = () => setDraft(t('ui.' + btn.dataset.key + 'Prompt')); });
  const qs = [...new Set(state.history.map((h) => h.query).filter(Boolean))].slice(0, 2);
  $('askChips').innerHTML = qs.length ? `<span class="caption">${t('recent')}</span>` + qs.map((q) => `<button class="ask-chip" title="${esc(q)}" data-q="${esc(q)}">${esc(q)}</button>`).join('') : '';
  $('askChips').querySelectorAll('button').forEach((btn) => { btn.onclick = () => setDraft(btn.dataset.q); });
}

function renderHistory() {
  const search = $('historySearch').value.trim().toLocaleLowerCase();
  const groups = new Map();
  const openGroups = new Set([...$('historyList').querySelectorAll('details[open]')].map((el) => el.dataset.group));
  state.history.forEach((h) => {
    if (search && ![h.query, h.trace_id, ...(h.databases || [])].join(' ').toLocaleLowerCase().includes(search)) return;
    const key = h.query || h.trace_id;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(h);
  });
  const row = (h) => `<button class="hist" title="${esc(h.query)}" data-trace="${esc(h.trace_id)}" aria-current="${h.trace_id === state.activeTrace}" ${busy ? 'disabled' : ''}>
    <span class="hist-q">${esc(h.query)}</span><span class="hist-meta"><span class="hist-time">${esc(h.created_at)}</span>
    ${h.success === false ? `<span class="chip chip-danger">${t('chip.failed')}</span>` : h.has_risk ? `<span class="chip chip-warn">${t('chip.needsCheck')}</span>` : h.degraded ? `<span class="chip chip-warn">${t('chip.degraded')}</span>` : ''}</span></button>`;
  $('historyList').innerHTML = [...groups.entries()].map(([key, items]) => `<div class="history-group">${row(items[0])}${items.length > 1 ? `<details class="history-versions" data-group="${esc(key)}" ${openGroups.has(key) || items.slice(1).some((h) => h.trace_id === state.activeTrace) ? 'open' : ''}><summary>${t('ui.versions', { n: items.length - 1 })}</summary>${items.slice(1).map(row).join('')}</details>` : ''}</div>`).join('') || `<p class="caption history-empty">${t(historyError ? 'ui.historyError' : search ? 'ui.noMatches' : 'chat.emptyHistory')}</p>`;
  if (historyError && groups.size) $('historyList').insertAdjacentHTML('beforeend', `<p class="caption history-empty history-status" role="status">${t('ui.historyError')}</p>`);
  $('historyList').querySelectorAll('.hist').forEach((el) => { el.onclick = () => openHistory(el.dataset.trace); });
}

/* ─── right rail ────────────────────────────────────────────────── */
function renderPipeline() {
  const r = state.current;
  const metaKeys = () => ['trace_id', t('meta.route'), t('meta.confidence'), t('meta.dbAccess'),
    t('meta.rows'), t('meta.duration'), 'tokens', t('meta.degraded')];
  if (!r) {
    $('pipeline').innerHTML = PIPE_IDS.map((id) => `
      <div class="pipe-step is-skip">
        <span class="pipe-node">${ICON.dot}</span>
        <span><span class="pipe-label">${t('pipe.' + id)}</span><span class="pipe-detail">${t('pipe.pending')}</span>${pipeNote(id)}</span>
      </div>`).join('');
    $('metaList').innerHTML = metaKeys().map((k) => `<dt>${k}</dt><dd>—</dd>`).join('');
    return;
  }
  const flags = r.step_logs.flatMap((s) => s.risk_findings || []);
  const db = r.queried_database;
  const skip = t('pipe.skipped');
  const repairs = r.step_logs.reduce((a, s) => a + (s.repair_attempts?.length || 0), 0);
  const steps = [
    { id: 'guard',     detail: t('pipe.guard.d'), s: 'done' },
    { id: 'context',   detail: t('pipe.context.d', { sid: esc(state.sessionId), onoff: t(state.longTerm ? 'on' : 'off') }), s: 'done' },
    { id: 'route',     detail: `${routeLabel(r.route)} — ${esc(r.reason)}`, s: 'done' },
    { id: 'retrieval', detail: db ? t('pipe.retrieval.d', { dbs: (r.selected_databases || []).map(esc).join(' · ') }) : skip, s: db ? 'done' : 'skip' },
    { id: 'plan',      detail: db ? t('pipe.plan.d', { n: r.step_logs.length, mode: t(r.step_logs.length > 1 ? 'pipe.plan.cross' : 'pipe.plan.single') }) : skip, s: db ? 'done' : 'skip' },
    { id: 'sqlgen',    detail: db ? t('pipe.sqlgen.d', { n: repairs }) : skip, s: db ? 'done' : 'skip' },
    { id: 'execute',   detail: db ? t('pipe.execute.d', { trunc: r.step_logs.some((s) => s.truncated) ? t('pipe.execute.trunc') : '' }) : skip, s: db ? 'done' : 'skip' },
    { id: 'validate',  detail: db ? (flags.length ? t('pipe.validate.flag', { n: flags.length }) : t('pipe.validate.pass')) : t('pipe.validate.skip'), s: flags.length ? 'flag' : (db ? 'done' : 'skip') },
  ];
  $('pipeline').innerHTML = steps.map((st) => `
    <div class="pipe-step is-${st.s}">
      <span class="pipe-node">${st.s === 'flag' ? ICON.warn : st.s === 'skip' ? ICON.dot : ICON.check}</span>
      <span>
        <span class="pipe-label">${t('pipe.' + st.id)}</span>
        <span class="pipe-detail">${st.detail}</span>
        ${pipeNote(st.id)}
      </span>
    </div>`).join('');

  const rows = r.step_logs.reduce((a, s) => a + s.row_count, 0);
  $('metaList').innerHTML = [
    ['trace_id', esc(r.trace_id)],
    [t('meta.route'), routeLabel(r.route) || esc(r.route)],
    [t('meta.confidence'), r.confidence != null ? r.confidence.toFixed(2) : '—'],
    [t('meta.dbAccess'), r.queried_database ? t('yes') : t('no')],
    [t('meta.rows'), r.queried_database ? String(rows) : '—'],
    [t('meta.duration'), r.duration_ms != null ? `${Math.round(r.duration_ms)} ms` : '—'],
    ['tokens', r.total_tokens != null ? String(r.total_tokens) : '—'],
    [t('meta.degraded'), r.degraded ? esc(r.degrade_reason || t('yes')) : t('no')],
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}

function renderPipelineRunning() {
  $('pipeline').innerHTML = `<p class="body-sm muted">${t('chat.pending')}</p>`;
  $('metaList').innerHTML = '';
}

function emptyState() {
  $('workbench').classList.add('is-empty');
  $('result').innerHTML = `<div class="welcome fade-in">
    <div class="eyebrow">${icon('spark')}${t('ui.kicker')}</div>
    <h1>${t('ui.welcome')}</h1><p>${t('ui.intro')}</p>
  </div>`;
  updateJump();
}

function stepTable(step, idx) {
  if (!step.rows.length) return `<p class="caption" style="margin-top:var(--space-4)">${t('step.noRows')}</p>`;
  return `
    <div class="table-wrap" tabindex="0" role="region" aria-label="${t('step.table.aria', { n: idx + 1, rows: step.row_count })}">
      <table class="ds-table" data-od-id="result-table-${idx}">
        <thead><tr>${step.columns.map((c) => `<th class="${step.numeric.includes(c) ? 'num-col' : ''}">${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${step.rows.map((row) => `<tr>${row.map((cell, i) => `<td class="${step.numeric.includes(step.columns[i]) ? 'num-col' : ''}">${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div><p class="table-hint" hidden>${t('ui.tableHint')}</p>`;
}

function renderResult(r, opts = {}) {
  const turn = opts.turn || turns.find((item) => item.result?.trace_id === r.trace_id) || activeTurn;
  turn.result = r; turn.opts = { ...opts, turn: undefined };
  if (turn === activeTurn) { state.current = r; state.currentOpts = turn.opts; }
  const root = responseRoot(turn);
  const comment = root.querySelector('.js-fb-comment')?.value;
  const expanded = opts.keepScroll ? [...root.querySelectorAll('details')].map((el) => el.open) : [];
  const selected = opts.keepScroll ? [...root.querySelectorAll('.js-tab[aria-selected="true"]')].map((el) => el.dataset.pane) : [];
  const flags = r.step_logs
    .flatMap((s, i) => (s.risk_findings || []).map((f) => ({ ...f, db: s.database, stepIdx: i })))
    .sort((a, b) => (a.severity === 'block' ? 0 : 1) - (b.severity === 'block' ? 0 : 1));
  const parts = [];

  parts.push(`
    <div class="fade-in stack-6">
      <div class="card answer-card" data-od-id="answer">
        <p class="answer-text">${esc(r.answer)}</p>
        <div class="answer-meta">
          ${(r.selected_databases || []).map((d) => `<span class="chip chip-db">${esc(d)}</span>`).join('')}
          ${r.degraded ? `<span class="chip chip-warn" title="${t('chip.degraded.title')}">${t('chip.degraded')}</span>` : ''}
        </div>
        ${r.reason ? `<p class="answer-reason">${esc(r.reason)}</p>` : ''}
        <div class="message-actions" style="margin:10px 0 0 -6px">${actionButton('chat.copy','copy','js-copy-answer')}${actionButton('chat.retry','refresh','js-retry')}${actionButton('chat.more','sliders','js-inspect')}</div>
        ${note('answer')}
      </div>`);

  if (flags.length) {
    parts.push(`
      <div class="card card-flag ${opts.keepScroll ? '' : 'flag-in'}" data-od-id="risk-flags">
        <div class="row-between" style="margin-bottom:var(--space-4)">
          <span class="h3" style="font-size:var(--text-lg)">${t('risk.title')}</span>
          <span class="chip chip-warn"><span class="dot"></span>${t('risk.count', { n: flags.length })}</span>
        </div>
        ${flags.map((f) => `
          <div class="flag">
            ${ICON.alert}
            <span>
              <span class="flag-kind">${esc(f.db)} · ${anomalyLabel(f.anomaly)}${f.severity === 'block' ? ' · ' + t('severity.block') : ''}</span>
              <span class="flag-text">${esc(f.detail)}</span>
              <button class="btn-jump js-jump" data-step="${f.stepIdx}">${t('risk.jump', { n: f.stepIdx + 1 })}</button>
            </span>
          </div>`).join('')}
        <p class="caption" style="margin-top:var(--space-4);line-height:1.55">${t('risk.foot')}</p>
        ${note('risk')}
      </div>`);
  }

  if (r.step_logs.length) parts.push(`<details class="query-details" open><summary>${t('ui.results')} <span class="muted">· ${t('step.rows', { n: r.step_logs.reduce((sum, step) => sum + step.row_count, 0) })}</span></summary>`);
  r.step_logs.forEach((s, i) => {
    parts.push(`
      <div class="card" id="stepcard-${i}" data-od-id="step-${i + 1}">
        <div class="step-head">
          <span class="step-title">
            <span class="step-idx">${t('step', { n: i + 1 })}</span>
            <span class="chip chip-db">${esc(s.database)}</span>
            ${s.success ? '' : `<span class="chip chip-danger">${t('step.failed')}</span>`}
            ${(s.repair_attempts || []).length ? `<span class="chip chip-warn">${t('step.repairs', { n: s.repair_attempts.length })}</span>` : ''}
          </span>
          <span style="display:flex;align-items:center;gap:var(--space-2)">
            <span class="caption num">${t('step.rows', { n: s.row_count })}${s.truncated ? t('step.truncated') : ''}</span>
            <button class="btn btn-ghost btn-sm js-copy" data-sql="${esc(s.sql)}">${t('copySql')}</button>
          </span>
        </div>
        <div class="tabs" role="tablist" aria-label="${t('step', { n: i + 1 })}">
          <button class="tab js-tab" id="tab-rows-${i}" role="tab" aria-selected="true" aria-controls="rows-${i}" data-pane="rows-${i}">${t('tab.rows', { n: s.row_count })}</button>
          <button class="tab js-tab" id="tab-sql-${i}" role="tab" aria-selected="false" aria-controls="sql-${i}" data-pane="sql-${i}">SQL</button>
        </div>
        <div id="rows-${i}" role="tabpanel" aria-labelledby="tab-rows-${i}">${stepTable(s, i)}</div>
        <div id="sql-${i}" role="tabpanel" aria-labelledby="tab-sql-${i}" hidden><pre class="sql">${esc(s.sql)}</pre></div>
        ${i === 0 ? note('step') : ''}
      </div>`);
  });

  if (r.step_logs.length) parts.push('</details>');
  if (r.trace_id && r.trace_id !== '\u2014') parts.push(feedbackCard(r));

  if (opts.fromHistory) {
    parts.push(`
      <div class="card" data-od-id="history-notice">
        <p class="body-sm">${t('history.replay', { what: t(r.step_logs.length ? 'history.replay.cached' : 'history.replay.sqlOnly') })}</p>
        <button class="btn btn-secondary btn-sm js-rerun" style="margin-top:var(--space-4)">${t('rerun')}</button>
      </div>`);
  }

  parts.push(`</div>`);
  root.innerHTML = parts.join('').replace(/(id|aria-controls|aria-labelledby|data-pane)="((?:tab-)?(?:stepcard|sql|rows)-\d+)"/g, (_, attr, id) => `${attr}="${turn.id}-${id}"`);
  bindResult(root, r, turn);
  if (comment && root.querySelector('.js-fb-comment')) root.querySelector('.js-fb-comment').value = comment;
  root.querySelectorAll('details').forEach((el, i) => { if (expanded[i] !== undefined) el.open = expanded[i]; });
  root.querySelectorAll('.js-tab').forEach((el) => { if (selected.includes(el.dataset.pane)) el.click(); });
  renderSources();
  renderPipeline();
  if (!opts.keepScroll) scrollLatest();
  updateComposer();
}

/* 用户判定：答错的进评测集，确认对的成为同类问题的参考写法。
   这是「工具越用越准」唯一不依赖我们自己出题的数据来源。 */
function feedbackCard(r) {
  const sent = state.feedback[r.trace_id];
  if (sent) return `<div class="card feedback-card" data-od-id="feedback"><div class="fb-done">${ICON.check}<span class="body-sm">${t('fb.sent.' + sent)}</span><button class="btn btn-ghost btn-sm js-fb-reset">${t('fb.change')}</button></div></div>`;
  return `<div class="card feedback-card" data-od-id="feedback">
    <div class="feedback-top"><span class="caption">${t('chat.feedback')}</span><div class="fb">
      <button class="btn btn-secondary btn-sm fb-btn js-fb" data-verdict="correct">${t('fb.correct')}</button>
      <button class="btn btn-secondary btn-sm fb-btn js-fb" data-verdict="wrong">${t('fb.wrong')}</button>
      <button class="btn btn-ghost btn-sm fb-btn js-fb" data-verdict="unsure">${t('fb.unsure')}</button>
    </div></div><details class="feedback-note"><summary>${t('ui.comment')}</summary>
    <textarea class="fb-comment js-fb-comment" rows="2" aria-label="${t('ui.comment')}" placeholder="${t('fb.comment.ph')}"></textarea></details>
    <p class="caption js-fb-status" role="status"></p></div>`;
}

async function submitFeedback(traceId, verdict, comment, statusEl) {
  if (statusEl) statusEl.textContent = t('fb.sending');
  try {
    const res = await fetch(api('/feedback'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ trace_id: traceId, verdict, comment: comment || '' }),
    });
    if (!res.ok) {
      const payload = await res.json().catch(() => ({}));
      throw new Error(payload.detail || res.status);
    }
    state.feedback[traceId] = verdict;
    const entry = state.history.find((x) => x.trace_id === traceId);
    if (entry) entry.verdict = verdict;
    const turn = turns.find((item) => item.result?.trace_id === traceId);
    if (turn) renderResult(turn.result, { ...turn.opts, turn, keepScroll: true });
    renderHistory();
  } catch (err) {
    if (statusEl) statusEl.textContent = `${t('fb.failed')}：${err.message}`;
  }
}

function bindResult(root = responseRoot(), r = state.current, turn = activeTurn) {
  root.querySelectorAll('.js-tab').forEach((tab) => {
    tab.tabIndex = tab.getAttribute('aria-selected') === 'true' ? 0 : -1;
    tab.addEventListener('click', () => {
      tab.closest('.tabs').querySelectorAll('.js-tab').forEach((other) => {
        other.setAttribute('aria-selected', String(other === tab)); other.tabIndex = other === tab ? 0 : -1;
        $(other.dataset.pane).hidden = other !== tab;
      });
    });
    tab.addEventListener('keydown', (e) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
      e.preventDefault();
      const tabs = [...tab.closest('.tabs').children];
      const next = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs.at(-1) : tabs.find((item) => item !== tab);
      next.click(); next.focus();
    });
  });
  root.querySelectorAll('.js-copy').forEach((btn) => { btn.onclick = () => copyText(btn.dataset.sql); });
  root.querySelectorAll('.js-jump').forEach((btn) => {
    btn.onclick = () => {
      const card = $(turn.id + '-stepcard-' + btn.dataset.step);
      if (!card) return;
      card.closest('details').open = true;
      card.querySelector('.js-tab[data-pane$="rows-' + btn.dataset.step + '"]')?.click();
      card.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
      card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 900);
    };
  });
  root.querySelectorAll('.js-fb').forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest('.card');
      const buttons = card.querySelectorAll('.js-fb'); buttons.forEach((b) => { b.disabled = true; });
      await submitFeedback(r.trace_id, btn.dataset.verdict, card.querySelector('.js-fb-comment')?.value.trim(), card.querySelector('.js-fb-status'));
      buttons.forEach((b) => { b.disabled = busy; });
    };
  });
  const reset = root.querySelector('.js-fb-reset');
  if (reset) reset.onclick = () => { delete state.feedback[r.trace_id]; renderResult(r, { ...turn.opts, turn, keepScroll: true }); };
  const copy = root.querySelector('.js-copy-answer'); if (copy) copy.onclick = () => copyText(r.answer);
  root.querySelectorAll('.js-rerun, .js-retry').forEach((btn) => { btn.onclick = () => { if (!busy) run(turn.question); }; });
  const inspect = root.querySelector('.js-inspect');
  if (inspect) inspect.onclick = () => { state.current = r; renderPipeline(); showTrace(true); };
}

function openHistory(trace) {
  if (busy) return;
  const h = state.history.find((x) => x.trace_id === trace);
  if (!h) return;
  resetConversation();
  createTurn(h.query);
  activeTurn.historyTrace = trace;
  state.activeTrace = trace;
  setDraft('');
  renderHistory();
  if (h.full) { renderResult(structuredClone(h.full), { fromHistory: true }); scrollLatest(true); return; }

  state.current = {
    trace_id: h.trace_id, route: h.route, queried_database: !!(h.databases || []).length,
    degraded: h.degraded, degrade_reason: '', confidence: null,
    reason: t('history.reason'), answer: '',
    selected_databases: h.databases || [], retrieved: h.tables || [],
    duration_ms: h.duration_ms || null, total_tokens: h.total_tokens || null, step_logs: [],
  };

  const sqlCards = (h.sqls || []).map((item, i) => {
    const sql = item.final_sql || item.sql || item.statement || '';
    const db = item.database || item.db || '';
    return `
      <div class="card" data-od-id="history-sql-${i}">
        <div class="step-head">
          <span class="step-title">
            <span class="step-idx">${t('step', { n: i + 1 })}</span>
            ${db ? `<span class="chip chip-db">${esc(db)}</span>` : ''}
          </span>
          <button class="btn btn-ghost btn-sm js-copy" data-sql="${esc(sql)}">${t('copySql')}</button>
        </div>
        <pre class="sql">${esc(sql)}</pre>
      </div>`;
  }).join('');

  responseRoot().innerHTML = `
    <div class="fade-in stack-6">
      <div class="card" data-od-id="history-notice">
        <div class="row-between" style="margin-bottom:var(--space-4)">
          <span style="display:flex;gap:var(--space-2);flex-wrap:wrap">
            <span class="chip">${routeLabel(h.route) || esc(h.route) || t('history.label')}</span>
            ${(h.databases || []).map((d) => `<span class="chip chip-db">${esc(d)}</span>`).join('')}
            ${h.degraded ? `<span class="chip chip-warn" title="${t('chip.degraded.title')}">${t('chip.degraded')}</span>` : ''}
            ${h.success === false ? `<span class="chip chip-danger">${t('chip.failed')}</span>` : ''}
          </span>

        </div>
        <p class="body-sm">${t('ui.historyInfo')}</p>
        ${h.error ? `<details class="feedback-note"><summary>${t('ui.errorDetails')}</summary><pre class="sql">${esc(h.error)}</pre></details>` : ''}
        <p class="caption" style="margin-top:var(--space-4);line-height:1.55">${t('history.notice')}</p>
        <button class="btn btn-secondary btn-sm js-rerun" style="margin-top:var(--space-4)">${t('rerun')}</button>
      </div>
      ${sqlCards}
    </div>`;
  bindResult();
  renderSources();
  renderPipeline();
  scrollLatest(true); updateComposer();
}

/* ─── 连接 & 查询 ───────────────────────────────────────────────── */
const api = (path) => (state.base ? state.base.replace(/\/$/, '') : '') + path;
const authHeaders = () => (state.apiKey ? { 'X-API-Key': state.apiKey } : {});

async function checkHealth() {
  const chip = $('connChip');
  try {
    // /health 不走鉴权，所以它只回答「服务在不在」
    const res = await fetch(api('/health'));
    if (!res.ok) throw new Error(String(res.status));
    state.live = true; $('connectionBanner').hidden = true;
    chip.className = 'chip status-chip is-live';
    $('connText').textContent = state.base ? t('conn.okTo', { base: state.base }) : t('conn.ok');
    loadHistory();
  } catch (_) {
    state.live = false; $('connectionBanner').hidden = false;
    chip.className = 'chip status-chip is-demo';
    $('connText').textContent = t('conn.down');
  }
}

async function loadHistory() {
  if (!state.live) return;
  const ask = (withUser) => fetch(
    api(`/history?limit=20${withUser ? `&user_id=${encodeURIComponent(state.userId)}` : ''}`),
    { headers: authHeaders() });
  try {
    let res = await ask(true);
    // 鉴权开启时，拿别人的 user_id 查历史会被拒；退回查这个 Key 自己的
    if (res.status === 403) res = await ask(false);
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    if (!Array.isArray(data.items)) throw new Error('Invalid history response');
    historyError = false;
    state.history = data.items.map((it) => {
      const prev = state.history.find((x) => x.trace_id === it.trace_id);
      return {
        trace_id: it.trace_id,
        created_at: fmtTime(it.created_at),
        query: it.query, route: it.route,
        databases: it.databases || [], tables: it.tables || [], sqls: it.sqls || [],
        success: it.success, degraded: it.degraded, error: it.error,
        duration_ms: it.duration_ms ?? null, total_tokens: it.total_tokens ?? null,
        has_risk: !!it.has_risk || (prev ? prev.has_risk : false),
        full: prev ? prev.full : null,
      };
    });
    state.history.forEach((h) => absorbSources(h.databases, h.tables));
    renderHistory(); renderExamples(); renderSources(); updateComposer();
  } catch (_) { historyError = true; renderHistory(); }
}

function normalize(payload, ms) {
  // 契约 §4.4.1：逐步骤日志的契约面名字是 `steps`；`step_logs` 是 /query 的
  // 历史名字，过渡期两个字段同时发。**两个都认、steps 优先**——
  // 服务端按 §6 删掉 step_logs 那天，这里一行都不用改。
  const steps = payload.steps || payload.step_logs || [];
  return {
    trace_id: payload.trace_id || '—',
    route: payload.route, reason: payload.reason || '', answer: payload.answer || '',
    confidence: typeof payload.confidence === 'number' ? payload.confidence : null,
    queried_database: !!payload.queried_database,
    selected_databases: payload.selected_databases || [],
    retrieved: [], // /query does not include retrieved table names; /history supplies them.
    degraded: !!payload.degraded, degrade_reason: payload.degrade_reason || '',
    duration_ms: ms, total_tokens: null,   // /query 不返回用量，稍后从 /history 回填
    step_logs: steps.map((s) => {
      const cols = (s.rows || []).reduce((acc, r) => {
        Object.keys(r).forEach((k) => { if (!acc.includes(k)) acc.push(k); });
        return acc;
      }, []);
      const numeric = cols.filter((c) =>
        (s.rows || []).some((r) => typeof r[c] === 'number') && (s.rows || []).every((r) => r[c] == null || typeof r[c] === 'number'));
      return {
        database: s.database, success: s.success, row_count: s.row_count, truncated: !!s.truncated,
        repair_attempts: s.repair_attempts || [], sql: s.final_sql || s.sql,
        columns: cols, numeric,
        rows: (s.rows || []).map((r) => cols.map((c) => (r[c] == null ? '—' : String(r[c])))),
        risk_findings: s.risk_findings || [],
      };
    }),
  };
}

let busy = false;
async function run(question) {
  const q = typeof question === 'string' ? question : $('q').value.trim();
  if (!q || busy) return;
  busy = true; state.current = null;
  const turn = createTurn(q);
  turn.pending = true;
  if (typeof question !== 'string') { $('q').value = ''; editingDraft = null; $('editNote').hidden = true; }
  requestController = new AbortController();
  updateComposer();
  $('result').setAttribute('aria-busy', 'true');
  responseRoot(turn).innerHTML = `<div class="thinking" role="status"><span class="thinking-dot"></span>${t('chat.thinking')}<span class="caption" id="waitElapsed"></span></div>`;
  renderPipelineRunning(); scrollLatest(true);
  const started = performance.now();
  const waitTimer = setInterval(() => { const el = $('waitElapsed'); if (el) el.textContent = t('ui.elapsed', { n: Math.floor((performance.now() - started) / 1000) }); }, 1000);
  try {
    const res = await fetch(api('/query'), {
      method: 'POST', signal: requestController.signal,
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ user_id: state.userId || 'anonymous', session_id: state.sessionId || 's1', query: q, enable_long_term: state.longTerm }),
    });
    const payload = await res.json();
    if (!res.ok) throw Object.assign(new Error('http'), { status: res.status, detail: payload.detail });
    const r = normalize(payload, performance.now() - started);
    state.activeTrace = r.trace_id;
    absorbSources(r.selected_databases, r.retrieved);
    state.history.unshift({
      trace_id: r.trace_id, created_at: new Date().toTimeString().slice(0, 5), query: q,
      route: r.route, databases: r.selected_databases, tables: r.retrieved, sqls: [],
      success: true, degraded: r.degraded, error: null,
      duration_ms: r.duration_ms, total_tokens: null,
      has_risk: r.step_logs.some((s) => s.risk_findings.length), full: r,
    });
    renderHistory(); renderExamples(); renderResult(r, { turn });
    backfillUsage(r.trace_id);
  } catch (err) {
    if (err.name === 'AbortError') {
      turn.stopped = true;
      responseRoot(turn).innerHTML = `<p class="body-sm muted">${t('chat.stopped')}</p><div class="message-actions">${actionButton('chat.retry','refresh','js-retry')}</div>`;
      bindResult(responseRoot(turn), null, turn); renderPipeline();
    } else {
      if (!state.live) checkHealth();
      turn.error = err; errorNotice(err, turn);
    }
  } finally {
    clearInterval(waitTimer);
    busy = false; turn.pending = false; requestController = null;
    $('result').setAttribute('aria-busy', 'false'); updateComposer(); updateJump();
    if (document.activeElement === $('btnRun')) $('q').focus();
  }
}

/* 客户端只量得到往返耗时，token 用量在服务端记账——查完从 /history 取回真值。 */
async function backfillUsage(traceId) {
  await loadHistory();
  const h = state.history.find((x) => x.trace_id === traceId);
  const turn = turns.find((x) => x.result?.trace_id === traceId);
  if (!h || !turn) return;
  h.full = turn.result;
  h.has_risk = turn.result.step_logs.some((x) => x.risk_findings.length);
  turn.result.retrieved = h.tables || [];
  if (h.duration_ms != null) turn.result.duration_ms = h.duration_ms;
  if (h.total_tokens != null) turn.result.total_tokens = h.total_tokens;
  renderHistory();
  if (!busy) renderPipeline();
  updateComposer();
}

const HTTP_HINT = (code) => (['401', '403', '429', '503'].includes(String(code)) ? t('err.' + code) : '');
function errorNotice(err, turn = activeTurn) {
  state.current = null;
  responseRoot(turn).innerHTML = `
    <div class="card fade-in" data-od-id="error-notice" style="border-color:color-mix(in oklch, var(--danger) 40%, var(--border))">
      <span class="chip chip-danger">${err.status ? `HTTP ${err.status}` : t('err.failed')}</span>
      <p class="h3" style="font-weight:500;margin-top:var(--space-4)">${esc(HTTP_HINT(err.status) || err.detail || t('err.generic'))}</p>
      <button class="btn btn-secondary btn-sm" style="margin-top:var(--space-4)" onclick="document.getElementById('btnSettings').click()">${t('err.check')}</button><button class="btn btn-ghost btn-sm js-retry">${t('chat.retry')}</button>
    </div>`;
  bindResult(responseRoot(turn), null, turn);
  renderSources();
  renderPipeline();
}

/* ─── bindings ──────────────────────────────────────────────────── */
$('skipToAsk').addEventListener('click', (e) => { e.preventDefault(); $('q').focus(); });
function rerenderAll() {
  applyStaticI18n(); renderStaticNotes(); renderSources(); renderHistory(); renderExamples();
  if (!turns.length) emptyState();
  else if (activeTurn.historyTrace && !activeTurn.result) openHistory(activeTurn.historyTrace);
  else turns.forEach((turn) => {
    if (turn.result) renderResult(turn.result, { ...turn.opts, turn, keepScroll: true });
    else if (turn.error) errorNotice(turn.error, turn);
    else if (turn.stopped) {
      responseRoot(turn).innerHTML = `<p class="body-sm muted">${t('chat.stopped')}</p><div class="message-actions">${actionButton('chat.retry','refresh','js-retry')}</div>`;
      bindResult(responseRoot(turn), null, turn);
    }
    const el = $(turn.id);
    el.querySelector('.js-copy-question').setAttribute('aria-label', t('chat.copyQuestion'));
    el.querySelector('.js-copy-question').title = t('chat.copyQuestion');
    el.querySelector('.js-edit').setAttribute('aria-label', t('chat.edit'));
    el.querySelector('.js-edit').title = t('chat.edit');
  });
  renderPipeline(); updateComposer();
  $('connText').textContent = t(state.live ? 'conn.ok' : 'conn.down');
}
$('btnLang').addEventListener('click', () => { state.lang = state.lang === 'en' ? 'zh' : 'en'; save(); rerenderAll(); });
$('btnExplain').addEventListener('click', () => {
  state.explain = !state.explain; $('btnExplain').setAttribute('aria-pressed', String(state.explain)); save(); rerenderAll();
});
$('composerForm').addEventListener('submit', (e) => { e.preventDefault(); busy ? requestController?.abort() : run(); });
$('q').addEventListener('input', updateComposer);
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); if (!busy) run(); }
});
$('cancelEdit').onclick = () => { setDraft(editingDraft || ''); editingDraft = null; $('editNote').hidden = true; };
$('chatScroll').addEventListener('scroll', updateJump, { passive: true });
$('jumpLatest').onclick = () => scrollLatest(true);
new ResizeObserver(() => {
  updateJump();
  document.querySelectorAll('.table-wrap').forEach((el) => { const hint = el.nextElementSibling; if (hint?.classList.contains('table-hint')) hint.hidden = el.scrollWidth <= el.clientWidth + 1; });
}).observe($('result'));
function showTrace(open) { $('tracePanel').hidden = !open; $('btnTrace').setAttribute('aria-expanded', String(open)); }
$('btnTrace').onclick = () => showTrace($('tracePanel').hidden);
$('closeTrace').onclick = () => { showTrace(false); $('btnTrace').focus(); };
$('btnSidebar').onclick = () => {
  if (matchMedia('(max-width: 900px)').matches) {
    const open = $('sidebar').classList.toggle('is-open'); $('drawerBackdrop').hidden = !open; $('workbench').inert = open; $('btnSidebar').setAttribute('aria-expanded', String(open));
    if (open) $('historySearch').focus();
  } else {
    $('sidebar').hidden = !$('sidebar').hidden;
    $('console').style.gridTemplateColumns = $('sidebar').hidden ? 'minmax(0,1fr)' : '';
    $('btnSidebar').setAttribute('aria-expanded', String(!$('sidebar').hidden));
  }
};
const mobileLayout = matchMedia('(max-width: 900px)');
function syncSidebar() {
  $('drawerBackdrop').hidden = true; $('workbench').inert = false;
  $('sidebar').hidden = false; $('sidebar').classList.remove('is-open'); $('console').style.gridTemplateColumns = '';
  $('btnSidebar').setAttribute('aria-expanded', String(!mobileLayout.matches));
}
mobileLayout.addEventListener('change', syncSidebar); syncSidebar();
$('historySearch').addEventListener('input', renderHistory);
$('drawerBackdrop').onclick = () => { closeMobileSidebar(); $('btnSidebar').focus(); };
$('reconnect').onclick = () => checkHealth();
document.addEventListener('click', (e) => {
  if (!e.target.closest('#sidebar, #btnSidebar')) closeMobileSidebar();
  if (!e.target.closest('#tracePanel, #btnTrace, .js-inspect')) showTrace(false);
});
$('btnLongTerm').addEventListener('click', () => {
  state.longTerm = !state.longTerm;
  $('btnLongTerm').setAttribute('aria-pressed', String(state.longTerm));
  save(); renderPipeline();
});
$('btnNew').addEventListener('click', () => {
  if (busy) return;
  resetConversation();
  state.sessionId = 's-' + crypto.randomUUID().slice(0, 8);
  $('sessionChip').textContent = state.sessionId; save();
  setDraft(''); closeMobileSidebar();
  renderSources(); renderHistory(); renderPipeline(); emptyState();
  $('q').focus();
});
$('btnRefreshHistory').addEventListener('click', () => { state.live ? loadHistory() : checkHealth(); });
$('btnHelp').addEventListener('click', () => $('dlgHelp').showModal());
$('btnSettings').addEventListener('click', () => {
  $('setBase').value = state.base; $('setKey').value = state.apiKey;
  $('setUser').value = state.userId; $('setSession').value = state.sessionId;
  $('dlgSettings').showModal();
});
$('dlgSettings').addEventListener('close', () => {
  if ($('dlgSettings').returnValue !== 'save') return;
  state.base = $('setBase').value.trim();
  state.apiKey = $('setKey').value.trim();
  state.userId = $('setUser').value.trim() || 'li';
  state.sessionId = $('setSession').value.trim() || 's1';
  $('sessionChip').textContent = state.sessionId;
  save(); checkHealth();
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('btnSettings').click(); }
  if (e.key === 'Escape') {
    if (!$('tracePanel').hidden) { showTrace(false); $('btnTrace').focus(); }
    if ($('sidebar').classList.contains('is-open')) { closeMobileSidebar(); $('btnSidebar').focus(); }
  }
  if (e.key === '/' && !document.activeElement.matches('input, textarea, [contenteditable]') && !document.querySelector('dialog[open]')) { e.preventDefault(); $('q').focus(); }
});

/* ─── boot ──────────────────────────────────────────────────────── */
$('btnLongTerm').setAttribute('aria-pressed', String(state.longTerm));
$('btnExplain').setAttribute('aria-pressed', String(state.explain));
applyStaticI18n();
renderStaticNotes();
$('sessionChip').textContent = state.sessionId;
renderSources();
renderHistory();
renderExamples();
renderPipeline();
emptyState();
updateComposer();
checkHealth();
</script>
